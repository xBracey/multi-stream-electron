<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Stream Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body { height: 100%; overflow: hidden; }
    
    body {
      background: #0a0a0f;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      cursor: crosshair;
    }
    
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      height: 100vh;
      gap: 4px;
      padding: 4px;
    }
    
    .card {
      position: relative;
      background: #1a1a2e;
      border-radius: 8px;
      overflow: hidden;
    }
    
    .card iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    
    .card.fullscreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1000;
      border-radius: 0;
    }
    
    .card.collapsed { display: none; }
    
    .card-label {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(0,0,0,0.7);
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 12px;
      z-index: 10;
    }
    
    .card.recording {
      border: 3px solid #ffaa00;
      animation: recordPulse 1s infinite;
    }
    
    .card.recording::before {
      content: '🎥 CLICK ON MUTE BUTTON';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 170, 0, 0.9);
      color: black;
      padding: 15px 30px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      z-index: 100;
    }
    
    @keyframes recordPulse {
      0%, 100% { border-color: #ffaa00; }
      50% { border-color: #ff6b6b; }
    }
  </style>
</head>
<body>
  <div class="grid" id="grid"></div>
  
  <script>
    const grid = document.getElementById('grid');
    let streams = ['', '', '', ''];
    let focused = 0;
    let fullscreenIndex = null;
    let isRecordingMode = false;
    let recordingStreamIndex = null;
    
    function loadFromStorage() {
      const saved = localStorage.getItem('multiStreamStreams');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed) && parsed.length === 4) {
            streams = parsed;
          }
        } catch (e) {}
      }
    }
    
    function saveToStorage() {
      localStorage.setItem('multiStreamStreams', JSON.stringify(streams));
    }
    
    loadFromStorage();
    
    function createGrid() {
      grid.innerHTML = '';
      
      streams.forEach((url, i) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.id = 'card-' + i;
        
        const label = document.createElement('div');
        label.className = 'card-label';
        label.textContent = 'Stream ' + (i + 1);
        card.appendChild(label);
        
        if (url) {
          const iframe = document.createElement('iframe');
          iframe.id = 'iframe-' + i;
          iframe.src = url;
          iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups allow-forms allow-scripts');
          iframe.setAttribute('allow', 'autoplay; fullscreen');
          iframe.setAttribute('allowfullscreen', 'true');
          card.appendChild(iframe);
        }
        
        grid.appendChild(card);
      });
    }
    
    function exitFullscreen() {
      const cards = document.querySelectorAll('.card');
      fullscreenIndex = null;
      cards.forEach(card => card.classList.remove('fullscreen', 'collapsed'));
    }
    
    // Handle clicks - notify main process if recording
    grid.addEventListener('click', () => {
      if (isRecordingMode && recordingStreamIndex !== null) {
        window.electronAPI.notifyUserClick();
      }
    });
    
    // Listen for commands from main process via IPC
    window.electronAPI.onFocus((stream) => {
      focused = stream;
    });
    
    window.electronAPI.onRefresh((stream) => {
      if (stream === 'all') {
        streams.forEach((url, i) => {
          const iframe = document.getElementById('iframe-' + i);
          if (iframe && url) iframe.src = url;
        });
      } else {
        const iframe = document.getElementById('iframe-' + stream);
        if (iframe && streams[stream]) iframe.src = streams[stream];
      }
    });
    
    window.electronAPI.onFullscreen((stream) => {
      const cards = document.querySelectorAll('.card');
      fullscreenIndex = stream;
      cards.forEach((card, i) => {
        if (i === stream) card.classList.add('fullscreen');
        else card.classList.add('collapsed');
      });
    });
    
    window.electronAPI.onExitFullscreen(() => {
      exitFullscreen();
    });
    
    window.electronAPI.onConfig((newStreams) => {
      if (newStreams && Array.isArray(newStreams) && newStreams.some(s => s)) {
        streams = newStreams;
        saveToStorage();
        createGrid();
      }
    });
    
    window.electronAPI.onClick(() => {
      const iframes = document.querySelectorAll('iframe');
      iframes.forEach((iframe) => {
        try {
          iframe.contentWindow?.postMessage({ type: 'click', x: 50, y: 50 }, '*');
        } catch (e) {}
      });
    });
    
    window.electronAPI.onClickPosition((data) => {
      const iframe = document.getElementById('iframe-' + data.stream);
      if (iframe) {
        try {
          iframe.contentWindow?.postMessage({ type: 'click', x: data.x, y: data.y }, '*');
        } catch (e) {}
      }
    });
    
    // Recording mode handlers
    window.electronAPI.onStartRecord((stream) => {
      isRecordingMode = true;
      recordingStreamIndex = stream;
      
      const card = document.getElementById('card-' + stream);
      if (card) card.classList.add('recording');
      
      console.log('Recording started for stream', stream);
    });
    
    window.electronAPI.onStopRecord(() => {
      if (recordingStreamIndex !== null) {
        const card = document.getElementById('card-' + recordingStreamIndex);
        if (card) card.classList.remove('recording');
      }
      isRecordingMode = false;
      recordingStreamIndex = null;
      
      console.log('Recording stopped');
    });
    
    window.electronAPI.onMutePositionCaptured((data) => {
      const card = document.getElementById('card-' + data.stream);
      if (card) card.classList.remove('recording');
      
      console.log('Mute position captured:', data);
    });
    
    // Initial load
    createGrid();
    
    // Auto-click after 5 seconds
    setTimeout(() => {
      const iframes = document.querySelectorAll('iframe');
      iframes.forEach((iframe) => {
        try {
          iframe.contentWindow?.postMessage({ type: 'click', x: 50, y: 50 }, '*');
        } catch (e) {}
      });
    }, 5000);
    
    // Keyboard shortcut: Escape to exit fullscreen
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && fullscreenIndex !== null) {
        exitFullscreen();
      }
    });
    
    // Click on card to toggle fullscreen
    grid.addEventListener('click', (e) => {
      const card = e.target.closest('.card');
      if (card && !isRecordingMode) {
        const index = parseInt(card.id.split('-')[1]);
        if (fullscreenIndex === index) {
          exitFullscreen();
        } else if (fullscreenIndex === null) {
          const cards = document.querySelectorAll('.card');
          fullscreenIndex = index;
          cards.forEach((c, i) => {
            if (i === index) c.classList.add('fullscreen');
            else c.classList.add('collapsed');
          });
        }
      }
    });
  </script>
</body>
</html>
