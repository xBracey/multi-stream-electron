<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Stream Control</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="container">
    <h1>🎮 Multi-Stream Control</h1>
    
    <div class="status" id="status">Connecting...</div>
    
    <div class="section">
      <h2>🔊 Audio Focus</h2>
      <div class="grid-4">
        <button class="btn focus-btn" data-stream="0">Stream 1</button>
        <button class="btn focus-btn" data-stream="1">Stream 2</button>
        <button class="btn focus-btn" data-stream="2">Stream 3</button>
        <button class="btn focus-btn" data-stream="3">Stream 4</button>
      </div>
    </div>
    
    <div class="section">
      <h2>🔄 Refresh</h2>
      <div class="grid-4">
        <button class="btn refresh-btn" data-stream="0">Stream 1</button>
        <button class="btn refresh-btn" data-stream="1">Stream 2</button>
        <button class="btn refresh-btn" data-stream="2">Stream 3</button>
        <button class="btn refresh-btn" data-stream="3">Stream 4</button>
      </div>
      <button class="btn btn-wide" id="refreshAll">🔄 Refresh All</button>
    </div>
    
    <div class="section">
      <h2>▶️ Playback</h2>
      <div class="grid-4">
        <button class="btn play-btn" data-stream="0">P1</button>
        <button class="btn play-btn" data-stream="1">P2</button>
        <button class="btn play-btn" data-stream="2">P3</button>
        <button class="btn play-btn" data-stream="3">P4</button>
      </div>
      <div class="btn-row">
        <button class="btn btn-small" id="pauseAll">⏸ Pause All</button>
        <button class="btn btn-small" id="playAll">▶ Play All</button>
      </div>
    </div>
    
    <div class="section">
      <h2>📺 Fullscreen</h2>
      <div class="grid-4">
        <button class="btn fullscreen-btn" data-stream="0">Stream 1</button>
        <button class="btn fullscreen-btn" data-stream="1">Stream 2</button>
        <button class="btn fullscreen-btn" data-stream="2">Stream 3</button>
        <button class="btn fullscreen-btn" data-stream="3">Stream 4</button>
      </div>
      <button class="btn btn-danger btn-wide" id="exitFullscreenBtn">⛶ Exit Fullscreen</button>
    </div>
    
    <div class="section">
      <h2>🔇 Mute/Unmute</h2>
      <p style="font-size: 11px; color: #666; margin-bottom: 10px;">Click bottom-right corner to mute</p>
      <div class="grid-4">
        <button class="btn mute-btn" data-stream="0">M1</button>
        <button class="btn mute-btn" data-stream="1">M2</button>
        <button class="btn mute-btn" data-stream="2">M3</button>
        <button class="btn mute-btn" data-stream="3">M4</button>
      </div>
      <button class="btn btn-outline btn-wide" id="enableAutoplayBtn">🖱️ Enable Autoplay</button>
    </div>
    
    <div class="section">
      <h2>⚙️ Configuration</h2>
      <a href="/config" class="btn btn-outline btn-wide">⚙️ Configure Streams</a>
    </div>
  </div>
  
  <script src="/control.js"></script>
</body>
</html>
